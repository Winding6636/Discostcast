version: '3'
services: 
  musicbot:
    container_name: InstanceMusicBot
    build:  ./
    volumes:
      - ./config:/musicbot/config
      - ./data:/musicbot/data
      - ./audio_cache:/musicbot/audio_cache
      - ./logs:/musicbot/logs
    network_mode: "host"
    restart: unless-stopped
    cpu_shares: 1024
    logging:
      options:
        max-size: "50k"
        max-file: "5"